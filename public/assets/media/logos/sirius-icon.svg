<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="siriusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="siriusS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="siriusGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#siriusBg)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Glowing Ribbon "S" -->
  <path d="M 33 14 C 33 14, 30 11, 24 11 C 17 11, 14 15, 14 19 C 14 26, 34 22, 34 30 C 34 36, 29 37, 24 37 C 17 37, 13 33, 13 33" 
        fill="none" 
        stroke="url(#siriusS)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Star Sparkle (Sirius Star) -->
  <polygon points="37,9 38.5,12.5 42,14 38.5,15.5 37,19 35.5,15.5 32,14 35.5,12.5" fill="url(#siriusGlow)"/>
</svg>
